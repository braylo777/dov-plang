# CI for .dov pLang: rustfmt, clippy, build, the whole test suite (unit, e2e, property and golden:
# strict C + ASan/UBSan, agent examples under TSan), `make examples`, coverage and the README check.
# Runs on macOS (clang) and Ubuntu (gcc).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # Fail instead of skipping if a sanitizer runtime is missing.
      DOV_REQUIRE_SAN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup default stable

      - name: Tool versions
        run: |
          rustc --version
          cargo --version
          cc --version

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build (release)
        run: cargo build --release --locked

      - name: Tests (unit, e2e, property, golden)
        run: cargo test --locked

      - name: Examples are formatted
        run: ./target/release/dovc fmt --check examples/*.dov

      - name: Examples match their snapshots
        run: make examples

      - name: Agent examples under ThreadSanitizer
        run: make tsan

      - name: README numbers equal results/metrics.json
        run: python3 scripts/readme_numbers.py --check

  coverage:
    name: coverage (ubuntu, >= 90% lines)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal -c llvm-tools-preview
          rustup default stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --locked --summary-only --fail-under-lines 90
