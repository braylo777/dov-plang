<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.t{font-size:16px;font-weight:bold}.s{font-size:12px;fill:#52606d}.m{font-family:Menlo,Consolas,monospace;font-size:12px}rect.b{fill:#eef4fb;stroke:#2f6fb3;stroke-width:1.5}rect.g{fill:#eefaf1;stroke:#2f8a4b;stroke-width:1.5}rect.o{fill:#fff6e8;stroke:#c27c0e;stroke-width:1.5}line,path.a{stroke:#3e4c59;stroke-width:1.5;fill:none}</style><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3e4c59"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<text x="20" y="28" class="t">Values and the heap: descriptors are copied, heap items never change</text>
<text x="20" y="62" class="m">let a = [1, 2];  let b = append(a, 3);  let c = append(a, 4);</text>
<rect class="b" x="20" y="90" width="150" height="44" rx="6"/><text x="95" y="110" text-anchor="middle" class="m">a {buf1, 0, 2}</text><text x="95" y="126" text-anchor="middle" class="s">on the stack</text>
<rect class="b" x="20" y="150" width="150" height="44" rx="6"/><text x="95" y="170" text-anchor="middle" class="m">b {buf1, 0, 3}</text><text x="95" y="186" text-anchor="middle" class="s">in place: a ended at used</text>
<rect class="b" x="20" y="210" width="150" height="44" rx="6"/><text x="95" y="230" text-anchor="middle" class="m">c {buf2, 0, 3}</text><text x="95" y="246" text-anchor="middle" class="s">copied: buf1.used is 3</text>
<rect class="o" x="300" y="100" width="300" height="60" rx="6"/><text x="320" y="122" class="m">buf1  used=3 cap=4</text>
<rect class="g" x="320" y="130" width="50" height="24"/><text x="345" y="147" text-anchor="middle" class="m">1</text><rect class="g" x="372" y="130" width="50" height="24"/><text x="397" y="147" text-anchor="middle" class="m">2</text><rect class="g" x="424" y="130" width="50" height="24"/><text x="449" y="147" text-anchor="middle" class="m">3</text><rect x="476" y="130" width="50" height="24" fill="#f5f7fa" stroke="#9aa5b1"/>
<rect class="o" x="300" y="200" width="300" height="60" rx="6"/><text x="320" y="222" class="m">buf2  used=3 cap=4</text>
<rect class="g" x="320" y="230" width="50" height="24"/><text x="345" y="247" text-anchor="middle" class="m">1</text><rect class="g" x="372" y="230" width="50" height="24"/><text x="397" y="247" text-anchor="middle" class="m">2</text><rect class="g" x="424" y="230" width="50" height="24"/><text x="449" y="247" text-anchor="middle" class="m">4</text><rect x="476" y="230" width="50" height="24" fill="#f5f7fa" stroke="#9aa5b1"/>
<line x1="170" y1="112" x2="298" y2="125" marker-end="url(#ar)"/><line x1="170" y1="172" x2="298" y2="140" marker-end="url(#ar)"/><line x1="170" y1="232" x2="298" y2="228" marker-end="url(#ar)"/>
<text x="640" y="110" class="s">Timeline</text>
<text x="640" y="134" class="s">1. literal: buf1 = [1,2], used 2</text>
<text x="640" y="154" class="s">2. append(a,3): a ends at used</text>
<text x="640" y="170" class="s">   → write slot 2, used 3</text>
<text x="640" y="190" class="s">3. append(a,4): a no longer ends</text>
<text x="640" y="206" class="s">   at used → copy into buf2</text>
<text x="640" y="226" class="s">4. a still reads [1,2]; b [1,2,3]</text>
<text x="640" y="246" class="s">5. v0.3 never frees buf1 or buf2</text>
<text x="20" y="296" class="s">Structs and enums live inline (stack or inside other values) and are copied whole. Strings work like slices of bytes.</text>
</svg>
