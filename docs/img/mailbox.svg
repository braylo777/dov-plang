<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
<style>text{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.t{font-size:16px;font-weight:bold}.s{font-size:12px;fill:#52606d}.m{font-family:Menlo,Consolas,monospace;font-size:12px}rect.b{fill:#eef4fb;stroke:#2f6fb3;stroke-width:1.5}rect.g{fill:#eefaf1;stroke:#2f8a4b;stroke-width:1.5}rect.o{fill:#fff6e8;stroke:#c27c0e;stroke-width:1.5}line,path.a{stroke:#3e4c59;stroke-width:1.5;fill:none}</style><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3e4c59"/></marker></defs>
<rect width="900" height="300" fill="#ffffff"/>
<text x="20" y="28" class="t">Agent mailbox flow: one global FIFO queue, run to completion</text>
<rect class="b" x="20" y="60" width="170" height="80" rx="6"/><text x="105" y="86" text-anchor="middle">fn main()</text><text x="105" y="106" text-anchor="middle" class="m">send c.add(5);</text><text x="105" y="124" text-anchor="middle" class="m">send c.report();</text>
<rect class="o" x="250" y="70" width="380" height="60" rx="6"/><text x="440" y="60" text-anchor="middle" class="s">dov_send appends; nothing runs yet</text>
<rect class="g" x="262" y="80" width="110" height="40" rx="4"/><text x="317" y="105" text-anchor="middle" class="m">c.add(5)</text>
<rect class="g" x="382" y="80" width="110" height="40" rx="4"/><text x="437" y="105" text-anchor="middle" class="m">c.report()</text>
<rect class="g" x="502" y="80" width="116" height="40" rx="4"/><text x="560" y="105" text-anchor="middle" class="m">… (tail)</text>
<line x1="190" y1="100" x2="248" y2="100" marker-end="url(#ar)"/>
<rect class="b" x="690" y="60" width="190" height="80" rx="6"/><text x="785" y="86" text-anchor="middle">dov_run()</text><text x="785" y="106" text-anchor="middle" class="s">pop head, call handler,</text><text x="785" y="122" text-anchor="middle" class="s">free args; until empty</text>
<line x1="630" y1="100" x2="688" y2="100" marker-end="url(#ar)"/>
<rect class="b" x="560" y="190" width="320" height="80" rx="6"/><text x="720" y="214" text-anchor="middle">agent Counter (owns its state)</text><text x="720" y="234" text-anchor="middle" class="m">var total: i64</text><text x="720" y="254" text-anchor="middle" class="s">only its own handlers read or write it</text>
<line x1="785" y1="140" x2="785" y2="188" marker-end="url(#ar)"/>
<path class="a" d="M560,250 L440,250 L440,132" marker-end="url(#ar)"/><text x="300" y="246" class="s">a handler's own sends go to the tail</text>
<text x="20" y="200" class="s">Messages hold copies of values.</text><text x="20" y="218" class="s">Heap data inside them is immutable,</text><text x="20" y="236" class="s">so no state is shared and mutable:</text><text x="20" y="254" class="s">no locks, no data races, same order every run.</text>
</svg>
